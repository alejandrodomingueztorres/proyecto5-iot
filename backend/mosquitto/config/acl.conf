# Permisos MQTT (docs/contrato.md): cada dispositivo solo escribe en su rama
# de topics y Node-RED solo lee. Lo que no está aquí queda prohibido.
# Después de editar este archivo: docker compose restart mosquitto

user dev01
topic write iot/dev01/#

user dev02
topic write iot/dev02/#

user dev03
topic write iot/dev03/#

user nodered
topic read iot/#

# Prueba de escalado: descomentar, crear el usuario con
# sudo bash mosquitto/crear-usuario.sh escalado y borrar ambos al terminar.
# user escalado
# topic write iot/#
